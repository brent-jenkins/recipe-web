<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Damson Kitchen">
  <!--
    Site favicon. Damson fruit on warm stone — identical to the app's
    recipe-app/assets/icon-source.svg. The site and the app are the same mark,
    not two drawings that resemble each other; change one and change both, then
    re-run the app's rasteriser.

    Draw order is stem → body → crease → leaf, so the stem tucks behind the fruit.
  -->
  <rect width="32" height="32" rx="7" fill="#F6F1ED"/>
  <g transform="translate(16,16) scale(0.28) translate(-53,-51)">
    <path d="M50 30C50.5 24 51 20 52 15" stroke="#833060" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <ellipse cx="50" cy="59" rx="30" ry="31" fill="#833060"/>
    <path d="M50 31C43.5 45 43.5 73 49 86" stroke="#5E2145" stroke-width="3.5" stroke-linecap="round" fill="none" opacity=".55"/>
    <path d="M53 28C62 16 78 12 86 17 79 26 64 31 53 28Z" fill="#86682F"/>
  </g>
</svg>
